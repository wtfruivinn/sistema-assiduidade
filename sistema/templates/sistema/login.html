{% extends 'sistema/base.html' %}

{% block title %}Login — Sistema de Assiduidade{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-12">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary"></i>
                    Iniciar Sessão
                </h3>

                {% if erro %}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle"></i> {{ erro }}
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Utilizador</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="nome.utilizador" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Palavra-passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center text-muted mt-3">
            <small>Acesso restrito a docentes e funcionários autorizados.</small>
        </p>
    </div>
</div>
{% endblock %}
